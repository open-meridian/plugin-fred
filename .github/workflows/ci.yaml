# The plugin is CI-first: a change lands through a pull request, and this run,
# with check.yaml, is its gate. `make ci-local` reproduces it locally, and the
# pre-push hook runs it before a push straight to main.
#
# The job is named for the make target it runs. It runs ci-remote rather than
# ci-local: check.yaml takes `make check`'s steps, so the difference is `make
# image`'s checks of the plugin's image. Building it pulls the SDK's base image
# and is what `meridian plugin upload` does, which ci-local checks before a
# push straight to main.
#
# The tests' container installs the SDK the plugin pins from PyPI on a
# runner. Locally the Makefile installs it from the sibling meridian-python
# checkout when that carries the pinned version.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make ci-remote
        run: make ci-remote
